<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collaborative Code Editor</title>

  <link rel="stylesheet" href="style.css" />

  <!-- CodeMirror 5 -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css"
  />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Collaborative Code Editor</h1>
        <p class="subtitle">Simple Google Docs-style real-time editor for code</p>
      </div>
    </header>

    <section class="join-panel" id="joinPanel">
      <h2>Join a Room</h2>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your name" />
      </div>

      <div class="form-group">
        <label for="roomId">Room ID</label>
        <input type="text" id="roomId" placeholder="Enter room id (e.g. room123)" />
      </div>

      <button id="joinBtn">Join Room</button>
    </section>

    <section class="editor-section hidden" id="editorSection">
      <aside class="sidebar">
        <div class="room-card">
          <h3>Room</h3>
          <p id="currentRoom">-</p>
        </div>

        <div class="users-card">
          <h3>Users Online</h3>
          <ul id="usersList"></ul>
        </div>

        <div class="typing-card">
          <h3>Status</h3>
          <p id="typingStatus">No one is typing</p>
        </div>
      </aside>

      <main class="editor-container">
        <textarea id="editor"></textarea>
      </main>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
